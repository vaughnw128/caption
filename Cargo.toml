[package]
name = "caption"
version = "0.1.0"
edition = "2024"
description = "Fast image and GIF captioning library and CLI"
default-run = "caption-image"

[[bin]]
name = "caption-image"
path = "src/main.rs"

[lib]
name = "caption"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
cosmic-text = "0.19.0"
image = { version = "0.25", features = ["gif", "jpeg", "png", "webp"] }
gif = "0.14.2"
webp-animation = "0.10"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
rayon = "1"
quantette = { version = "0.5", features = ["threads"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
divan = "0.1"

[[bench]]
name = "caption"
harness = false

[[bench]]
name = "caption_webp"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
debug = 1
incremental = true

[profile.test]
debug = 1
incremental = true
